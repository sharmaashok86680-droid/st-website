<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Santu Traders</title>
        <!-- Website Favicon Icon -->
<link rel="icon" type="image/png" href="LOGO - Copy (3).png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- Simple Header -->
    <header class="header">
        <div class="container nav-container">
            <div class="logo-section">
                <div class="logo-badge">ST</div>
                <div class="brand-info">
                    <h1>SANTU TRADERS</h1>
                    <p>Neemuch (M.P.)</p>
                </div>
            </div>
            <nav class="navbar">
                <a href="index.html">← Back to Home</a>
            </nav>
        </div>
    </header>

    <!-- Login Form Section -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Portal Login</h2>
            <p class="auth-sub">Santu Traders Admin & Farmer/Buyer Login</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Select User Type / रोल चुनें:</label>
                    <select id="userRole" required>
                        <option value="farmer">Kisan / Buyer (Customer)</option>
                        <option value="admin">Admin (Ashok Bhardwaj)</option>
                    </select>
                </div>

                <div class="form-group">
    <label>Email ID ya Mobile Number:</label>
    <input type="text" id="loginIdentifier" placeholder="Email ID ya Mobile Number darj karein" required>
</div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="btn btn-login-submit">Login Karein</button>
            </form>

            <div class="auth-footer">
                <p>Naya account banana hai? <a href="register.html">Register Here</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <p>© Santu Traders - Ashok Bhardwaj (9755631229)</p>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
